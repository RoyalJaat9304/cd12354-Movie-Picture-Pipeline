apiVersion: v1
data:
  mapRoles: |
    - rolearn: arn:aws:iam::490421149893:role/udacity-node-group
      groups:
      - system:bootstrappers
      - system:nodes
      username: system:node:{{EC2PrivateDNSName}}
  mapUsers: |
    - userarn: arn:aws:iam::490421149893:user/github-action-user
      username: github-action-role
      groups:
      - system:masters
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system